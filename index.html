<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>품질보증 업무 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 고정 사이드바(페이지 목록) + 우측 12칸 그리드 위젯 보드 */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #f8f9fb;
  --ink: #12161c; --ink-2: #4a525e; --ink-3: #8a929d;
  --line: #e2e6eb; --line-strong: #c9cfd7;
  --accent: #1f5fa8; --accent-soft: #e6eef8;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --good-ink: #0a6e0a; --good-bg: #e7f5e7;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-bg: #fdf3dc;
  --serious: #ec835a; --serious-ink: #a8431b; --serious-bg: #fcebe3;
  --crit: #d03b3b; --crit-ink: #b02a2a; --crit-bg: #fbe5e5;
  --info-ink: #1f5fa8; --info-bg: #e6eef8;
  --neutral-bg: #eef0f3;
  --shadow: 0 1px 2px rgba(18,22,28,.05);
  --f-sans: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1215; --surface: #181c21; --surface-2: #1e2329;
  --ink: #f1f3f5; --ink-2: #b8c0ca; --ink-3: #7d8691;
  --line: #2a3038; --line-strong: #3a424c;
  --accent: #6aa5ec; --accent-soft: #1c2a3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good-ink: #5fd35f; --good-bg: #16301a; --warn-ink: #fbc54d; --warn-bg: #352a10;
  --serious-ink: #f3a07e; --serious-bg: #3a2218; --crit-ink: #f07a7a; --crit-bg: #3a1a1a;
  --info-ink: #8dbbf2; --info-bg: #1c2a3b; --neutral-bg: #262c33;
  --shadow: none; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0f1215; --surface: #181c21; --surface-2: #1e2329;
  --ink: #f1f3f5; --ink-2: #b8c0ca; --ink-3: #7d8691;
  --line: #2a3038; --line-strong: #3a424c;
  --accent: #6aa5ec; --accent-soft: #1c2a3b;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good-ink: #5fd35f; --good-bg: #16301a; --warn-ink: #fbc54d; --warn-bg: #352a10;
  --serious-ink: #f3a07e; --serious-bg: #3a2218; --crit-ink: #f07a7a; --crit-bg: #3a1a1a;
  --info-ink: #8dbbf2; --info-bg: #1c2a3b; --neutral-bg: #262c33;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-sans); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 0 8px; }
.brand b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
#nav { display: grid; gap: 16px; }
.nav-group { border-radius: 8px; }
.nav-group h4 { margin: 0 0 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; display: flex; align-items: center; gap: 4px; cursor: grab; border-radius: 5px; position: relative; min-height: 22px; }
.nav-group h4:hover { background: var(--surface-2); }
.nav-grip { font-size: 12px; letter-spacing: -2px; opacity: 0; width: 10px; margin-left: -6px; }
.nav-group h4:hover .nav-grip, .nav-item:hover::before { opacity: 1; }
.nav-grip { display: none; }
.nav-h { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item { position: relative; border-radius: 6px; }
.nav-item::before { content: "⠿"; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); font-size: 11px; letter-spacing: -2px; color: var(--ink-3); opacity: 0; pointer-events: none; }
.nav-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-del { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-3); border-radius: 5px; font-size: 11px; line-height: 1; padding: 4px 6px; opacity: 0; transition: opacity .1s; }
.nav-group h4 .nav-del { position: static; transform: none; padding: 2px 5px; }
.nav-fold { border: 0; background: transparent; color: var(--ink-3); width: 16px; padding: 0; font-size: 10px; line-height: 1; flex: none; }
.nav-n { font-family: var(--f-mono); font-weight: 400; font-size: 10.5px; color: var(--ink-3); opacity: .8; }
.nav-tools { display: flex; gap: 2px; margin-left: auto; opacity: 0; transition: opacity .1s; }
.nav-group h4:hover .nav-tools, .nav-tools:focus-within { opacity: 1; }
.nav-mv { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-3); border-radius: 4px; font-size: 10.5px; line-height: 1; padding: 2px 5px; }
.nav-mv:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.nav-mv:disabled { opacity: .35; cursor: default; }
@media (hover: none) { .nav-tools { opacity: 1; } }
.nav-group.folded .nav-item:not(.on), .nav-group.folded .nav-add { display: none; }
.nav-group.folded h4 { margin-bottom: 0; }
.nav-group.folded h4 .nav-h { color: var(--ink-2); }
.nav-bar { display: flex; justify-content: flex-end; margin: -6px 0 -10px; }
.nav-all { border: 0; background: transparent; color: var(--ink-3); font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.nav-all:hover { color: var(--accent); background: var(--surface-2); }
.nav-item:hover .nav-del, .nav-group h4:hover .nav-del, .nav-del:focus-visible, .nav-del.armed { opacity: 1; }
.nav-item:hover .nav-cnt, .nav-item:hover .nav-dot { visibility: hidden; }
.nav-del:hover, .nav-del.armed { color: var(--crit-ink); border-color: var(--crit); background: var(--crit-bg); }
.nav-del.armed { font-weight: 600; padding: 4px 8px; }
@media (hover: none) { .nav-del { opacity: .8; } .nav-item .nav-cnt { margin-right: 28px; } }
.nav-item.nav-dragging, .nav-group.nav-dragging { opacity: .4; }
.nav-item.drop-above::after, .nav-item.drop-below::after, .nav-group.drop-above::after, .nav-group.drop-below::after { content: ""; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.nav-item.drop-above::after { top: -2px; } .nav-item.drop-below::after { bottom: -2px; }
.nav-group { position: relative; }
.nav-group.drop-above::after { top: -9px; } .nav-group.drop-below::after { bottom: -9px; }
.nav-group.drop-into { background: var(--accent-soft); outline: 1.5px dashed var(--accent); outline-offset: 2px; }
.nav-group a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav-group a:hover { background: var(--surface-2); color: var(--ink); }
.nav-group a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.side-foot { margin-top: auto; display: grid; gap: 6px; }

.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit-ink); }
.btn.ghost { border-color: transparent; background: transparent; }

.main { padding: 24px 28px 48px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.top p { margin: 2px 0 0; color: var(--ink-2); }
.top .meta { font-size: 12px; color: var(--ink-3); font-family: var(--f-mono); }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.board { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
.card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card .sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* KPI */
.kpis { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { position: relative; overflow: hidden; padding: 14px 16px 12px; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kpi-c, transparent); }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.kpi .lbl > span:first-child { min-width: 0; }
.kpi .lbl .pill { flex: none; }
.kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.kpi .val { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; }
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.kpi .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); margin-top: 4px; min-height: 18px; }
.delta { font-weight: 600; font-family: var(--f-mono); font-size: 11.5px; }
.delta.up { color: var(--good-ink); } .delta.down { color: var(--crit-ink); }
.kpi svg.spark { flex: 0 1 72px; min-width: 36px; height: 26px; margin-bottom: 4px; }
.kpi .val { white-space: nowrap; }

/* status pill */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-good { background: var(--good-bg); color: var(--good-ink); }
.st-warning { background: var(--warn-bg); color: var(--warn-ink); }
.st-serious { background: var(--serious-bg); color: var(--serious-ink); }
.st-critical { background: var(--crit-bg); color: var(--crit-ink); }
.st-info { background: var(--info-bg); color: var(--info-ink); }
.st-neutral { background: var(--neutral-bg); color: var(--ink-2); }

/* chart */
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-sans); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; }
.chart .target { stroke: var(--crit); stroke-width: 1.25; stroke-dasharray: 4 3; }
.chart .target-lbl { fill: var(--crit-ink); font-size: 10.5px; font-weight: 600; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .mk, .chart .bar:hover { opacity: .8; }
.chart .endlbl { fill: var(--ink); font-weight: 600; font-size: 11.5px; }

/* hbar */
.hbars { display: grid; gap: 9px; }
.hrow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hrow .nm { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htrack { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.htrack b { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.hrow:first-child .htrack b { background: var(--accent); }
.hrow .v { font-family: var(--f-mono); font-size: 12px; color: var(--ink); min-width: 52px; text-align: right; }

/* table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.mono { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }

/* tasks */
.tasks { display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task .t { font-weight: 500; min-width: 0; }
.task .m { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--ink-3); }
.task .dd, .kb-m .dd, .dd-b .dd { font-family: var(--f-mono); font-weight: 600; }
.dd.over { color: var(--crit-ink); } .dd.soon { color: var(--warn-ink); }
.task .right { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; justify-content: center; }
.mini { width: 84px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.mini b { display: block; height: 100%; background: var(--accent); }

/* progress */
.prog { display: grid; gap: 12px; }
.prow .top2 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.prow .top2 span:last-child { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.prow .note { color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }
.ptrack { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.ptrack b { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.ptrack b.full { background: var(--good); }

/* note */
.note-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.note-list li { padding-left: 14px; position: relative; color: var(--ink-2); }
.note-list li.b::before { content: ""; position: absolute; left: 2px; top: .65em; width: 5px; height: 5px; border-radius: 1px; background: var(--ink-3); }

.err { grid-column: 1 / -1; background: var(--crit-bg); color: var(--crit-ink); padding: 12px 14px; border-radius: 8px; font-size: 13px; }

/* tooltip */
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
#tip b { font-family: var(--f-mono); }

/* editor drawer (GUI) */
:root { --dw: min(600px, 100%); }
.drawer-bg { position: fixed; inset: 0; background: rgba(10,14,18,.35); z-index: 40; }
body.editing .drawer-bg { display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: var(--dw); background: var(--surface); border-left: 1px solid var(--line); z-index: 41; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -8px 0 24px rgba(10,14,18,.08); }
@media (min-width: 1180px) { :root { --dw: min(600px, 46vw); } body.editing .main { padding-right: calc(var(--dw) + 28px); } }
.drawer header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.drawer header h2 { margin: 0; font-size: 16px; }
.drawer .body { padding: 16px 20px 24px; flex: 1; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-content: start; min-height: 0; }
.sec, .wlist, .we, .we-body, .rows, .icard { min-width: 0; }
.drawer .hint { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.drawer .hint code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.drawer textarea.code { min-height: 420px; width: 100%; resize: vertical; font: 12.5px/1.55 var(--f-mono); padding: 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); tab-size: 2; }
.drawer footer { padding: 10px 20px 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.drawer footer .row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.drawer .msg { font-size: 12.5px; min-height: 18px; color: var(--ink-3); }
.drawer .msg.bad { color: var(--crit-ink); } .drawer .msg.ok { color: var(--good-ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; color: var(--ink-2); }
.tabs button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.sec { display: grid; gap: 10px; }
.sec h5 { margin: 0; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.sec h5 .cnt { font-weight: 400; font-size: 12px; color: var(--ink-3); }
.cgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px 10px; }
@media (max-width: 520px) { .cgrid { grid-template-columns: 1fr 1fr; } .cgrid > * { grid-column: auto !important; } }
.fld { display: grid; gap: 3px; min-width: 0; align-content: start; }
.fld > span { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.f { width: 100%; min-width: 0; border: 1px solid var(--line-strong); border-radius: 5px; padding: 5px 8px; background: var(--surface); font-size: 13px; }
.f:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
textarea.f { resize: vertical; line-height: 1.5; }
.f.sm { width: auto; padding: 3px 6px; font-size: 12px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding-top: 20px; cursor: pointer; }
.wlist { display: grid; gap: 8px; }
.we { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.we.open { border-color: var(--accent); }
.we-head { display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 4px; }
.we-tog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; padding: 5px 6px; border-radius: 5px; }
.we-tog:hover { background: var(--surface-2); }
.car { color: var(--ink-3); width: 10px; font-size: 11px; flex: none; }
.we-type { flex: none; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 4px; }
.we-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.ib { border: 0; background: transparent; color: var(--ink-3); padding: 4px 7px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
.ib:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.del:hover, .ib.armed, .btn.armed { color: var(--crit-ink); background: var(--crit-bg); }
.we-body { padding: 12px 12px 14px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.rows { display: grid; gap: 8px; }
.icard { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 10px; background: var(--surface-2); display: grid; gap: 6px; }
.icard-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.gwrap { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: 13px; }
.gt th, .gt td { padding: 3px; border: 0; white-space: normal; vertical-align: top; }

.wimg .rl { stroke: var(--crit); stroke-width: 1.4; } .wimg .tg { stroke: var(--crit); stroke-dasharray: 2 2; }

.lk-ic { width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: 14px; flex: none; color: var(--accent); }

.cal-d.out { background: transparent; }
.cal-d.today { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.cal-n { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-left: 2px; }
.cal-ev { --ev: var(--s1); display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--ev); background: var(--surface); color: var(--ink); font: inherit; font-size: 10.5px; line-height: 1.35; padding: 1px 4px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.cal-ev:hover { background: var(--accent-soft); }
.cal-ev.done { color: var(--ink-3); text-decoration: line-through; }
.cal-more { font-size: 10.5px; color: var(--ink-3); padding-left: 4px; }

/* 간트 차트 */
.gnt { display: grid; gap: 2px; }
.gt-head, .gt-row { display: grid; grid-template-columns: minmax(120px, 28%) minmax(0, 1fr); gap: 10px; align-items: center; }
.gt-row { padding: 3px 0; border-radius: 5px; cursor: pointer; }
.gt-row:hover { background: var(--surface-2); }
.gt-lbl { display: grid; min-width: 0; padding-left: 4px; }
.gt-t { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-s { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gt-track { position: relative; height: 22px; }
.gt-head .gt-track { height: 18px; border-bottom: 1px solid var(--line); }
.gt-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.gt-tick.today { color: var(--crit-ink); font-weight: 600; top: 0; background: var(--surface); padding: 0 3px; }
.gt-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.gt-today { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--crit); opacity: .7; z-index: 1; }
.gt-bar { position: absolute; top: 5px; height: 12px; border-radius: 6px; background: var(--s1); z-index: 2; }
.gt-bar.done { background: var(--good); } .gt-bar.late { background: var(--crit); }
.gt-bar.open { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.35) 4px 8px); }
.gt-ms { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); border-radius: 2px; background: var(--s1); z-index: 2; }
.gt-ms.done { background: var(--good); } .gt-ms.late { background: var(--crit); }
.gt-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: flex-end; font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.gt-legend i { display: inline-block; width: 14px; height: 8px; border-radius: 4px; margin-right: 5px; background: var(--s1); vertical-align: middle; }
.gt-legend i.late { background: var(--crit); } .gt-legend i.done { background: var(--good); } .gt-legend i.ms { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); }
@media (max-width: 560px) { .gt-head, .gt-row { grid-template-columns: 96px minmax(0, 1fr); } }

/* 이상 알림 */
.al-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.al-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.al-chip b { font-variant-numeric: tabular-nums; }
.al-chip.critical { background: var(--crit-bg); color: var(--crit-ink); } .al-chip.serious { background: var(--serious-bg, var(--crit-bg)); color: var(--serious-ink, var(--crit-ink)); } .al-chip.warning { background: var(--warn-bg); color: var(--warn-ink); }
.al-clear { color: var(--good-ink); background: var(--good-bg); border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
.al-grp { border-left: 3px solid var(--line-strong); padding: 2px 0 6px 10px; margin-bottom: 8px; }
.al-grp.critical { border-left-color: var(--crit); } .al-grp.serious { border-left-color: var(--serious); } .al-grp.warning { border-left-color: var(--warn); }
.al-gh { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin-bottom: 2px; }
.al-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); align-self: center; }
.al-grp.critical .al-dot { background: var(--crit); } .al-grp.serious .al-dot { background: var(--serious); } .al-grp.warning .al-dot { background: var(--warn); }
.al-n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.al-more { margin-left: auto; font-size: 11.5px; color: var(--ink-3); text-decoration: none; } .al-more:hover { color: var(--accent); }
.al-item { display: flex; align-items: baseline; gap: 10px; padding: 4px 6px; border-radius: 5px; font-size: 12.5px; cursor: pointer; }
.al-item:hover { background: var(--surface-2); }
.al-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.al-s { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.al-rest { font-size: 11.5px; color: var(--ink-3); padding: 2px 6px; }
.al-oks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--good-ink); margin-top: 4px; }

/* 관리도 */
.cc-cl { stroke: var(--ink-3); stroke-width: 1.2; }
.cc-ucl { stroke: var(--crit); stroke-width: 1.4; stroke-dasharray: 5 4; }
.cc-spec { stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 2 3; }
text.cc-lbl { font-size: 10.5px; stroke: none; } text.cc-lbl.cc-cl { fill: var(--ink-3); } text.cc-lbl.cc-ucl { fill: var(--crit-ink); } text.cc-lbl.cc-spec { fill: var(--warn-ink); }
.cc-alert { color: var(--crit-ink); font-weight: 600; } .cc-ok { color: var(--good-ink); font-weight: 600; }

/* 히트맵 */
table.hm { border-collapse: separate; border-spacing: 3px; width: 100%; table-layout: fixed; min-width: 480px; }
table.hm thead th:first-child { width: 22%; } table.hm thead th:last-child { width: 64px; }
table.hm tfoot td { text-align: center; }
table.hm th, table.hm td { border: 0; padding: 6px 8px; }
table.hm thead th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-align: center; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
table.hm thead th:first-child { text-align: left; }
.hm-r { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12.5px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.hm-c { text-align: center; border-radius: 4px; background: color-mix(in srgb, var(--s1) var(--hm), var(--surface-2)); font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 44px; }
.hm-c.zero { background: var(--surface-2); }
.hm-c span { color: var(--ink); } .hm-c span.on { color: #fff; font-weight: 600; }
.hm-t { color: var(--ink-2); font-size: 12px; }
table.hm tfoot th { text-align: left; font-size: 11.5px; color: var(--ink-3); }
.hm-legend { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.hm-legend i { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2), var(--s1)); }

:root { --s1-soft: color-mix(in srgb, var(--s1) 38%, transparent); }
/* 목록 열 너비 조절 */
.dv-tbl th { position: relative; }
.col-rs { position: absolute; top: 0; right: -4px; width: 9px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
.col-rs::after { content: ""; position: absolute; top: 20%; bottom: 20%; left: 4px; width: 2px; border-radius: 1px; background: transparent; transition: background .1s; }
.dv-tbl th:hover .col-rs::after { background: var(--line-strong); }
.col-rs:hover::after, .col-rs.on::after { background: var(--accent); top: 0; bottom: 0; }

.dv-tbl.fixed { table-layout: fixed; }
.dv-tbl.fixed th, .dv-tbl.fixed td { overflow: hidden; text-overflow: ellipsis; }
.dv-tbl.fixed td.clip { max-width: none; }
.dv-tbl.fixed .th-btn { max-width: 100%; overflow: hidden; }
.dv-tbl.fixed .th-btn span { overflow: hidden; text-overflow: ellipsis; }
.dv-tbl.fixed td.editing { overflow: visible; }

/* 데이터 파일 저장 상태 */
.store-chip { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; text-align: left; }

.store-chip.ok i { background: var(--good-ink, #2f8a4c); }
.store-chip.warn { border-color: var(--warn-ink); color: var(--warn-ink); background: var(--warn-bg); } .store-chip.warn i { background: var(--warn-ink); }
.store-chip.bad { border-color: var(--crit-ink); color: var(--crit-ink); } .store-chip.bad i { background: var(--crit-ink); }

@keyframes stpulse { from { opacity: .3; } to { opacity: 1; } }

/* 칸 바로 고치기 */

td.editing > :not(.ce-in) { visibility: hidden; }
.ce-in { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; margin: 0; border: 0; border-radius: 3px; padding: 0 8px; background: var(--surface); color: var(--ink); font: inherit; text-align: inherit; outline: none; box-shadow: inset 0 0 0 2px var(--accent); z-index: 3; }

td.ce:hover { box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 3px; }
td.has-open { position: relative; padding-right: 46px !important; }
.row-open { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 11px; padding: 2px 7px; border-radius: 4px; cursor: pointer; opacity: 0; }

.row-open:hover { color: var(--ink); border-color: var(--line-strong); }
@media (hover: none) { .row-open { opacity: 1; } }

/* 첨부 파일 관리 */

.am-meta a { color: var(--accent); }
.lb-media { max-width: 100%; max-height: 100%; border-radius: 4px; background: #000; }

/* 항목 구성 · 목록 머리글 */
.mp-desc { width: 100%; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink-2); padding: 2px 0 6px; }
.mp-desc:focus, .fl-name:focus { outline: none; }
.fl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }

.fl-list { display: grid; }

.fl-row:hover { background: var(--surface-2); }

.fl-name:hover { border-color: var(--line); } .fl-name:focus { border-color: var(--accent); background: var(--surface); }
.fl-name.bad { border-color: var(--crit-ink); }
.fl-type { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.fl-type:hover { border-color: var(--line-strong); color: var(--ink); }

.fl-more { opacity: .6; } .fl-row:hover .fl-more { opacity: 1; }
.fd-before { border-top-color: var(--accent) !important; } .fd-after { border-bottom-color: var(--accent) !important; }
th.fd-before { box-shadow: inset 2px 0 0 var(--accent); } th.fd-after { box-shadow: inset -2px 0 0 var(--accent); }
.fl-prev { margin-top: 6px; }
.th-l { display: inline-flex; align-items: center; gap: 5px; }
.th-l i, .th-btn i { font-style: normal; font: 10.5px var(--f-mono); color: var(--ink-3); }
.th-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; font: inherit; color: inherit; padding: 3px 6px; margin-left: -6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.th-btn:hover, .th-btn:focus-visible { background: var(--line); color: var(--ink); }

.th-add { width: 36px; }

.th-add button:hover { background: var(--line); color: var(--ink); }
.dv-empty { color: var(--ink-3); text-align: center; padding: 28px 12px !important; font-size: 13px; }
.pp-mini { width: 132px; padding: 3px 6px; font-size: 12.5px; }
.pp-sort { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
@media (max-width: 640px) { .fl-row { grid-template-columns: 16px 26px minmax(0, 1fr) 28px; } .fl-row .fl-type, .fl-row .fl-extra, .fl-row .fl-req { grid-column: 3 / 4; justify-self: start; } }

/* 사진·파일 첨부 */
.fz { display: grid; gap: 6px; border-radius: 6px; padding: 2px; }
.fz.over { outline: 2px dashed var(--accent); outline-offset: 2px; background: var(--surface-2); }
.fz-list { display: grid; gap: 4px; }
.fz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.fz-card { position: relative; margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; display: grid; }
.fz-prev { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 0; padding: 0; background: var(--surface-2); cursor: zoom-in; display: grid; place-items: center; overflow: hidden; }

.fz-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.fz-thumb { width: 44px; height: 36px; border: 0; padding: 0; border-radius: 4px; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; }
.fz-doc b { font: 600 11px var(--f-mono); color: var(--ink-2); }

.fz-add span { font-size: 11.5px; color: var(--ink-3); }
.fz-add:hover, .fz-add:focus-visible { background: var(--surface-2); color: var(--ink); }
.fz-wait { display: grid; gap: 8px; padding: 10px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12.5px; }
.fz-wait > div { display: flex; flex-wrap: wrap; gap: 6px; }
.fz-cell { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.fz-cell img { width: 44px; height: 33px; object-fit: cover; border-radius: 3px; display: block; }
.fz-cell b { font: 600 10.5px var(--f-mono); color: var(--ink-2); background: var(--surface-2); border-radius: 3px; padding: 4px 5px; }
.lightbox { position: fixed; inset: 0; z-index: 120; background: rgba(8,10,14,.93); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding: 14px 16px; color: #e8ebef; }
.lb-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; font-size: 13px; }

.lb-acts { margin-left: auto; display: flex; gap: 6px; }

.lb-nav:hover { background: rgba(255,255,255,.24); }
.lb-nav.prev { left: 0; } .lb-nav.next { right: 0; }
.lb-path { font: 11.5px var(--f-mono); color: #8e98a3; overflow-wrap: anywhere; }

.pk-btn { border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 5px; padding-block: 5px; font: inherit; }
.pk.pk-btn { font-size: 13px; color: var(--ink-3); }
.pk-btn:hover, .pk-btn:focus-visible { background: var(--line); color: var(--ink); }
.pk-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-textlbl.pk-btn { display: inline-flex; padding: 3px 6px; margin-left: -6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.pk-add { justify-self: start; border: 0; background: transparent; color: var(--ink-3); font: inherit; font-size: 13px; padding: 6px; border-radius: 5px; cursor: pointer; }
.pk-add:hover, .pk-add:focus-visible { background: var(--surface-2); color: var(--ink); }
.proppop #ppName { font-size: 13.5px; }
.pp-t { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.pp-t i { font-style: normal; font-family: var(--f-mono); font-size: 11px; width: 18px; text-align: center; color: var(--ink-3); }
.pp-chk input { margin: 0; }


/* board edit affordances */
.card { position: relative; }
.w-tools { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.w-tools button { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 11.5px; padding: 2px 8px; border-radius: 5px; }
.w-tools button:hover { color: var(--accent); border-color: var(--accent); }
.card:hover .w-tools, .w-tools:focus-within { opacity: 1; }
@media (hover: none) { .w-tools { opacity: 1; } }
.xmenu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(10,14,18,.16); padding: 4px; min-width: 210px; display: grid; }
.xmenu h6 { margin: 4px 8px 4px; font-size: 11px; color: var(--ink-3); font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xmenu button { display: flex; justify-content: space-between; gap: 14px; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; text-align: left; font-size: 13px; }
.xmenu button:hover, .xmenu button:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
.xmenu .ext { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.xmenu.xq { width: 280px; gap: 4px; }
.xq-q { margin: 0 4px 2px; }
.xq-list { display: grid; max-height: min(360px, 55vh); overflow-y: auto; overscroll-behavior: contain; }
.xmenu .xq-list button.act { background: var(--accent-soft); color: var(--accent); }
.xq-none { padding: 10px; font-size: 12.5px; color: var(--ink-3); }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 70; background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 7px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast { display: flex; align-items: center; gap: 12px; }
#toast.has-act { pointer-events: auto; }
.toast-act { border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; text-decoration: underline; padding: 2px 4px; font-size: 13px; }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.add-tile { grid-column: 1 / -1; border: 1.5px dashed var(--line-strong); background: transparent; border-radius: 8px; padding: 16px; color: var(--ink-2); font-weight: 600; }
.add-tile:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.menu-btn { display: none; }
@media (max-width: 960px) {
  .board > .card { grid-column: 1 / -1 !important; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 30; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.2); }
  .side.open { transform: none; }
  .main { padding: 16px 16px 40px; }
  .menu-btn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b id="appName">품질보증 업무 현황</b><span id="appMeta"></span></div>
    <div class="asof" id="asofBox">
      <div class="asof-h"><span>기준일</span><button type="button" class="ib" id="asofToday" title="오늘로 (T)">오늘</button></div>
      <div class="asof-row">
        <button type="button" class="ib" id="asofPrev" title="한 달 전" aria-label="한 달 전">◀</button>
        <input type="date" class="f" id="asofInput" aria-label="기준일">
        <button type="button" class="ib" id="asofNext" title="한 달 후" aria-label="한 달 후">▶</button>
      </div>
      <div class="asof-cmp"><label class="chk inline" title="다른 날짜의 핵심 지표와 나란히 비교"><input type="checkbox" id="cmpOn"> 비교일과 나란히 보기</label><input type="date" class="f" id="cmpInput" hidden aria-label="비교일"></div>
    </div>
    <div class="nav-search" role="search"><input class="f" id="navQ" type="search" placeholder="페이지·데이터베이스 찾기" autocomplete="off" aria-label="페이지·데이터베이스 찾기"><kbd class="nav-kbd" aria-hidden="true">/</kbd><button type="button" class="ib" id="navQClear" hidden aria-label="찾기 지우기">✕</button></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn primary" id="btnNew" type="button" title="단축키 N">＋ 새로 만들기 <kbd>N</kbd></button>
      <button class="btn" id="btnExport" type="button">파일로 저장 · 불러오기</button>
      <button class="btn ghost" id="btnTrash" type="button" title="지운 기록·페이지·데이터베이스 되살리기">휴지통<span class="tr-n"></span></button>
      <button class="btn ghost" id="btnTheme" type="button">화면 테마 전환</button>
    </div>
  </aside>
  <main class="main">
    <div class="past-banner" id="pastBanner" hidden></div>
    <div class="laybar" id="layBar" hidden></div>
    <div class="top">
      <div>
        <button class="btn menu-btn" id="btnMenu" type="button" aria-label="메뉴">☰ 메뉴</button>
        <h1 id="pTitle"></h1>
        <p id="pDesc"></p>
      </div>
      <div style="display:grid;gap:6px;justify-items:end">
        <div class="meta" id="pMeta"></div>
        <div class="top-actions">
          <span class="badge-prev" id="prevBadge" hidden>편집 미리보기 · 저장 전</span>
          <span class="badge-local" id="localBadge" hidden>브라우저에 저장된 수정본 사용 중</span>
          <button class="btn" id="btnSearch" type="button" title="페이지·데이터베이스·기록 한 번에 찾기 (Ctrl+K)">⌕ 전체 검색 <kbd>Ctrl K</kbd></button>
          <button class="btn" id="btnQuick" type="button" title="단축키 R" aria-haspopup="menu">＋ 데이터 추가 <kbd>R</kbd></button>
          <button class="btn" id="btnPageX" type="button" aria-haspopup="menu" title="이 페이지를 이미지·PDF·월간 보고서로">⤓ 내보내기</button>
          <button class="btn primary" id="btnEdit" type="button">이 페이지 편집</button>
        </div>
      </div>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>
<div id="tip"></div>

<div id="drawerWrap" hidden>
  <div class="drawer-bg" data-a="close"></div>
  <section class="drawer" id="drawer" role="dialog" aria-label="편집"></section>
</div>

<script src="pages.config.js"></script>
<script src="app.js"></script>
</body>
</html>
